name: Streak keeper

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6,20 * * *'
  push:
    branches:
      - main

jobs:
  login:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: corepack enable && pnpm install

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Restore/Save State Cache
        uses: actions/cache@v4
        with:
          path: state
          # Use run_id to ensure we always save a new cache entry with the updated state
          key: state-${{ runner.os }}-${{ github.run_id }}
          # Restore from the most recent cache with this prefix
          restore-keys: |
            state-${{ runner.os }}-

      # A saved browser state eventually expires.  When credentials are configured
      # as repository secrets, refresh it before attempting the practice session.
      - name: Verify or refresh Duolingo session
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DUOLINGO_EMAIL: ${{ secrets.DUOLINGO_EMAIL }}
          DUOLINGO_PASSWORD: ${{ secrets.DUOLINGO_PASSWORD }}
        run: |
          if pnpm login-verify; then
            exit 0
          fi

          if [ -z "$DUOLINGO_EMAIL" ] || [ -z "$DUOLINGO_PASSWORD" ]; then
            echo "The saved Duolingo session has expired. Add DUOLINGO_EMAIL and DUOLINGO_PASSWORD repository secrets to allow automatic renewal."
            exit 1
          fi

          pnpm login-auto -- --force-login

      - name: Run Practice
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          DUOLINGO_EMAIL: ${{ secrets.DUOLINGO_EMAIL }}
          DUOLINGO_PASSWORD: ${{ secrets.DUOLINGO_PASSWORD }}
          HEADLESS: true
        run: pnpm practice
